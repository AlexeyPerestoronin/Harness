[package]
name = "agent-loop"
version.workspace = true
edition.workspace = true
description = "Asynchronous agent loop, vendor agents and request pipeline."

[dependencies]
# Typed settings for the loop and agents.
conf = { path = "../conf" }
# Unified user interaction contract (logging, questions, confirmations).
interactions = { path = "../interactions" }
# Tool registry assembled from the conf `tools` object.
tools = { path = "../tools" }
# JSON for dump files and HTTP bodies.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Async HTTP client for vendor REST APIs.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Async runtime, time and cancellation.
tokio = { version = "1", features = ["rt", "macros", "time"] }
tokio-util = "0.7"
async-trait = "0.1"
# Conversation / chat identifiers for xAI.
uuid = { version = "1", features = ["v4"] }
# Session folder timestamps and execution-time formatting.
chrono = "0.4"
# Random 5..=20 s delay on HTTP 503 in the shared vendor request layer.
rand = "0.8"
