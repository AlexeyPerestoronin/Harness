[package]
name = "tools"
version.workspace = true
edition.workspace = true
description = "Agent tool modules (fs, git, terminal, user, skills, roles)."

[dependencies]
# Typed tool-module settings produced by the conf crate.
conf = { path = "../conf" }
# Unified user interaction contract (input/output + log sink).
interactions = { path = "../interactions" }
# Async tool-call dispatch: blocking modules run through `spawn_blocking`.
tokio = { version = "1", features = ["rt", "macros"] }
# JSON Schema descriptors and tool-call argument objects.
serde_json = "1"
# Regular expressions for find_str_by_regex and find_files_by_regex.
regex = "1"
# Decode command output as utf-8 / oem / cp1251.
encoding_rs = "0.8"

[dev-dependencies]
async-trait = "0.1"
