[package]
name = "tools"
version.workspace = true
edition.workspace = true
description = "Agent tool modules (fs, git, terminal, user, skills, roles)."

[dependencies]
# Typed tool-module settings produced by the conf crate.
conf = { path = "../conf" }
# Session logger passed into every tool module.
logger = { path = "../logger" }
# JSON Schema descriptors and tool-call argument objects.
serde_json = "1"
# Regular expressions for find_str_by_regex and find_files_by_regex.
regex = "1"
# Decode command output as utf-8 / oem / cp1251.
encoding_rs = "0.8"
