read:
  get:
    summary: Read a text file inside cwd
    parameters:
      - name: path
        in: query
        required: true
        schema:
          type: string
    responses:
      '200':
        description: File content
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/FsReadResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '412':
        $ref: '../components/responses.yaml#/PreconditionFailed'
write:
  put:
    summary: Create or overwrite a text file inside cwd
    parameters:
      - name: path
        in: query
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/FsWriteRequest'
    responses:
      '200':
        description: File written
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/FsWriteResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '412':
        $ref: '../components/responses.yaml#/PreconditionFailed'
move:
  post:
    summary: Move or rename an entry inside cwd
    parameters:
      - name: src
        in: query
        required: true
        schema:
          type: string
      - name: dst
        in: query
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Entry moved
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/FsMoveResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '412':
        $ref: '../components/responses.yaml#/PreconditionFailed'
