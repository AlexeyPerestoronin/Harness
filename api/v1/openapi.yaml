openapi: 3.0.3
info:
  title: Harness Server REST API
  version: 1.5.0
  description: >-
    HTTPS REST API exposed by `harness.exe --serve`. All routes except
    `/api/v1/health` require a bearer token.
servers:
  - url: https://{host}:{port}
    description: Base URL of `harness.exe --serve`. Replace with configured values.
    variables:
      host:
        default: 127.0.0.1
      port:
        default: '443'
security:
  - bearerAuth: []
paths:
  /api/v1/health:
    $ref: './server/health.yaml'
  /api/v1/run:
    $ref: './run/lifecycle.yaml#/start'
  /api/v1/run/current:
    $ref: './run/lifecycle.yaml#/current'
  /api/v1/run/stop:
    $ref: './run/lifecycle.yaml#/stop'
  /api/v1/run/input:
    $ref: './run/lifecycle.yaml#/input'
  /api/v1/config:
    $ref: './config/config.yaml#/config'
  /api/v1/config/default:
    $ref: './config/config.yaml#/default'
  /api/v1/fs/list:
    $ref: './fs/dirs.yaml#/list'
  /api/v1/fs/read:
    $ref: './fs/files.yaml#/read'
  /api/v1/fs/write:
    $ref: './fs/files.yaml#/write'
  /api/v1/fs/mkdir:
    $ref: './fs/dirs.yaml#/mkdir'
  /api/v1/fs/remove:
    $ref: './fs/dirs.yaml#/remove'
  /api/v1/fs/move:
    $ref: './fs/files.yaml#/move'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
