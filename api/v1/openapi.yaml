openapi: 3.0.3
info:
  title: Harness Server REST API
  version: 1.5.0
  description: >-
    HTTPS REST API exposed by `harness.exe --serve`. All routes except
    `/api/v1/health` require a bearer token.
servers:
  - url: https://{host}:{port}
    description: Base URL of `harness.exe --serve`. Replace with configured values.
    variables:
      host:
        default: 127.0.0.1
      port:
        default: '443'
security:
  - bearerAuth: []
paths:
  /api/v1/health:
    get:
      summary: Public server health and state
      security: []
      responses:
        '200':
          description: Server is reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/run:
    post:
      summary: Start a run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartRunRequest'
      responses:
        '202':
          description: Run started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartRunResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /api/v1/run/current:
    get:
      summary: Poll current/last run state
      responses:
        '200':
          description: Current run state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/run/stop:
    post:
      summary: Stop the current run
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopRunRequest'
      responses:
        '200':
          description: No active run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunStateResponse'
        '202':
          description: Stop accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunStateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/run/input:
    post:
      summary: Answer a pending input
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitInputRequest'
      responses:
        '202':
          description: Answer accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitInputResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/config:
    get:
      summary: Read redacted server configuration
      responses:
        '200':
          description: Configuration state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      summary: Validate and save server configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutConfigRequest'
      responses:
        '200':
          description: Configuration saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutConfigResponse'
        '400':
          description: Configuration validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigInvalidResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/config/default:
    post:
      summary: Create default configuration if missing
      responses:
        '200':
          description: Default or current configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigDefaultResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/fs/list:
    get:
      summary: List a directory inside cwd
      parameters:
        - name: path
          in: query
          required: false
          description: Relative path; empty means cwd root
          schema:
            type: string
      responses:
        '200':
          description: Directory entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FsListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /api/v1/fs/read:
    get:
      summary: Read a text file inside cwd
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: File content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FsReadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /api/v1/fs/write:
    put:
      summary: Create or overwrite a text file inside cwd
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FsWriteRequest'
      responses:
        '200':
          description: File written
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FsWriteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /api/v1/fs/mkdir:
    post:
      summary: Create a directory inside cwd
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Directory created or already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FsMkdirResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /api/v1/fs/remove:
    delete:
      summary: Remove a file or empty directory inside cwd
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Entry removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FsRemoveResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /api/v1/fs/move:
    post:
      summary: Move or rename an entry inside cwd
      parameters:
        - name: src
          in: query
          required: true
          schema:
            type: string
        - name: dst
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Entry moved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FsMoveResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
  responses:
    BadRequest:
      description: Invalid request or validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, invalid or incorrectly formed bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Path protected by the FS deny-list
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: State conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PreconditionFailed:
      description: Configuration missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    ConfigState:
      type: string
      enum: [ok, missing, invalid]
    RunState:
      type: string
      enum: [idle, running, waitingInput, stopping, finished, failed, stopped]
    HealthResponse:
      type: object
      required: [status, version, serverTime, authRequired, runState, configState]
      properties:
        status:
          type: string
        version:
          type: string
        serverTime:
          type: string
          format: date-time
        authRequired:
          type: boolean
        runState:
          $ref: '#/components/schemas/RunState'
        configState:
          $ref: '#/components/schemas/ConfigState'
    StartRunRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
    StartRunResponse:
      type: object
      required: [runState, runUrl]
      properties:
        runState:
          $ref: '#/components/schemas/RunState'
        runUrl:
          type: string
    RunSummary:
      type: object
      required: [iteration, tokens, usdApprox, usdReal]
      properties:
        iteration:
          type: integer
        tokens:
          type: integer
        usdApprox:
          type: number
        usdReal:
          type: number
          nullable: true
    PendingInputKind:
      type: string
      enum: [text, confirm]
    PendingInput:
      type: object
      required: [requestId, kind, prompt, timeoutAt, sensitive]
      properties:
        requestId:
          type: string
        kind:
          $ref: '#/components/schemas/PendingInputKind'
        prompt:
          type: string
        timeoutAt:
          type: string
          format: date-time
        sensitive:
          type: boolean
          default: false
    RunStats:
      type: object
      required: [iteration, tokens, usdApprox, usdReal]
      properties:
        iteration:
          type: integer
        tokens:
          type: integer
        usdApprox:
          type: number
        usdReal:
          type: number
          nullable: true
    RunResult:
      type: object
      required: [ok, runState, stats, error]
      properties:
        ok:
          type: boolean
        runState:
          $ref: '#/components/schemas/RunState'
        stats:
          $ref: '#/components/schemas/RunStats'
        error:
          type: string
          nullable: true
    RunStatusResponse:
      type: object
      required: [runState]
      properties:
        runState:
          $ref: '#/components/schemas/RunState'
        startedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        summary:
          $ref: '#/components/schemas/RunSummary'
        pendingInput:
          $ref: '#/components/schemas/PendingInput'
        result:
          $ref: '#/components/schemas/RunResult'
    StopRunRequest:
      type: object
      properties:
        reason:
          type: string
    SubmitInputRequest:
      type: object
      required: [requestId, answer]
      properties:
        requestId:
          type: string
        answer:
          type: string
    SubmitInputResponse:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: boolean
    RunStateResponse:
      type: object
      required: [runState]
      properties:
        runState:
          $ref: '#/components/schemas/RunState'
    ConfigResponse:
      type: object
      required: [path, exists, text, valid, validationError]
      properties:
        path:
          type: string
        exists:
          type: boolean
        text:
          type: string
          nullable: true
        valid:
          type: boolean
        validationError:
          type: string
          nullable: true
    PutConfigRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
    PutConfigResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        path:
          type: string
        valid:
          type: boolean
        error:
          $ref: '#/components/schemas/ErrorBody'
    ConfigInvalidResponse:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
        error:
          $ref: '#/components/schemas/ErrorBody'
    ConfigDefaultResponse:
      type: object
      required: [path, exists, text, valid]
      properties:
        path:
          type: string
        exists:
          type: boolean
        text:
          type: string
        valid:
          type: boolean
    FsEntry:
      type: object
      required: [name, kind, size]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [file, dir]
        size:
          type: integer
    FsListResponse:
      type: object
      required: [path, entries]
      properties:
        path:
          type: string
        entries:
          type: array
          items:
            $ref: '#/components/schemas/FsEntry'
    FsReadResponse:
      type: object
      required: [path, text]
      properties:
        path:
          type: string
        text:
          type: string
    FsWriteRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
    FsWriteResponse:
      type: object
      required: [ok, path]
      properties:
        ok:
          type: boolean
        path:
          type: string
    FsMkdirResponse:
      type: object
      required: [ok, path]
      properties:
        ok:
          type: boolean
        path:
          type: string
    FsRemoveResponse:
      type: object
      required: [ok, path]
      properties:
        ok:
          type: boolean
        path:
          type: string
    FsMoveResponse:
      type: object
      required: [ok, src, dst]
      properties:
        ok:
          type: boolean
        src:
          type: string
        dst:
          type: string
